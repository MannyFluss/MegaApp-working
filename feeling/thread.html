<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>A waiting thread</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#263935;color:#c0d4c1}canvas{display:block;width:100%;height:100%;touch-action:none;outline-offset:-5px}p{position:absolute;left:0;right:0;bottom:24px;text-align:center;font:14px/1.5 Georgia,serif;pointer-events:none;margin:0}
</style><canvas aria-label="Pull a suspended point and release it. Arrow keys pull; space releases." tabindex="0"></canvas><p>Pull gently. Let it settle.</p>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
let w=1,h=1,x=.5,y=.43,vx=0,vy=0,contact=null,frame=0,last=0;
function size(){w=innerWidth;h=innerHeight;const d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);draw()}
function draw(){g.fillStyle='#263935';g.fillRect(0,0,w,h);g.strokeStyle='#b8cdad';g.lineWidth=1.1;g.beginPath();g.moveTo(w*.12,h*.24);g.quadraticCurveTo(w*.31,h*(.25+y)*.5,w*x,h*y);g.quadraticCurveTo(w*.7,h*(.25+y)*.5,w*.88,h*.24);g.stroke();
 for(const px of [.12,.88]){g.beginPath();g.arc(w*px,h*.24,2,0,Math.PI*2);g.fillStyle='#9ab69e';g.fill()}
 const light=g.createRadialGradient(w*x,h*y,0,w*x,h*y,50);light.addColorStop(0,'#c8deb824');light.addColorStop(1,'#c8deb800');g.fillStyle=light;g.fillRect(w*x-50,h*y-50,100,100);g.beginPath();g.arc(w*x,h*y,7,0,Math.PI*2);g.fillStyle='#d1dfbb';g.fill();
}
function tick(now){frame=0;const dt=Math.min(.025,(now-(last||now))/1000);last=now;if(contact===null){vx+=(.5-x)*dt*15;vy+=(.43-y)*dt*15;const friction=Math.exp(-dt*3.2);vx*=friction;vy*=friction;x+=vx*dt;y+=vy*dt}draw();if(contact===null&&Math.abs(x-.5)+Math.abs(y-.43)+Math.abs(vx)+Math.abs(vy)>.0005)frame=requestAnimationFrame(tick);else last=0}
function wake(){if(!frame)frame=requestAnimationFrame(tick)}
function point(e){x=Math.max(.15,Math.min(.85,e.clientX/w));y=Math.max(.15,Math.min(.8,e.clientY/h));vx=vy=0;draw()}
function end(){contact=null;if(reduce.matches){x=.5;y=.43;draw()}else wake()}
c.onpointerdown=e=>{if(contact!==null)return;contact=e.pointerId;c.setPointerCapture(contact);c.focus();point(e)};c.onpointermove=e=>{if(e.pointerId===contact)point(e)};c.onpointerup=e=>{if(e.pointerId===contact)end()};c.onpointercancel=c.onlostpointercapture=end;
c.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))return;e.preventDefault();const d={ArrowLeft:[-.08,0],ArrowRight:[.08,0],ArrowUp:[0,-.08],ArrowDown:[0,.08],' ':[0,0]}[e.key];x=Math.max(.15,Math.min(.85,x+d[0]));y=Math.max(.15,Math.min(.8,y+d[1]));draw();if(e.key===' ')end()};onresize=size;size();
</script></html>
